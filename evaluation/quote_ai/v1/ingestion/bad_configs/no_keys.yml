# expect: at least 1 item
# A table without keys: a replay could only append, so every retry would double the data.
sources:
  - name: dbxlab_synthetic
    type: file
    description: synthetic
    owner: sales-ops
    schedule: on_demand
    volume: sales_bronze.landing
    landing: dbxlab
    format: csv
    tables:
      - target: sales_bronze.price_book_raw
        pattern: "price_book*.csv"
        keys: []
