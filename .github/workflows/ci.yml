name: CI

# Every pull request: unit tests, and the bundle validated against the shared dev copy (target dev-shared). Not prod:
# the prod environment waits for a reviewer, which would hold every pull request.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install databricks-sdk pyyaml pydantic requests pytest fastapi httpx
      # AI-25: includes test_release_manifest.py (the manifest's versions, the evaluation package version) and
      # test_promote.py / test_smoke_test.py (alias promotion, the post-deploy smoke test through the app's API).
      # Includes the Ingestion suite's config checks and the generated bundle resources matching the config, and the
      # QuoteAI state machine, QuoteService and app back-end tests (the Agent workflow suite starts there).
      - run: pytest -q tests
      # AI-22: the evaluation gate. The pure-code suites of the package (v1/thresholds.yml, runs: ci) on every pull
      # request: ingestion, mapping, win model, eligibility, fulfilment, search, comparison (without the judge),
      # pricing, workflow, reliability. Any required threshold missed: exit 1, the check is red.
      - run: python evaluation/quote_ai/run_eval.py --suites ci

  # AI-22: the full package, with the extraction model, Genie and the comparison judge, only on pull requests that
  # touch prompts, models, retrieval or agents: the quote_ai_eval job in dev-shared (as sp-dbx-lakehouse). The job's
  # exit status fails this check. A judge run is ~100-200 model calls, so it does not run on every commit.
  # Verify before recording: deploying the pull request's code to dev-shared for the run (or a per-PR target).
  # AI-25: a pull request that changes release/release.yml (a release) always runs the full package, all sixteen
  # suites; so do changes to the rules and their configuration.
  eval-gate:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(src/quote_ai/(llm|search|agents|rules)/|config/quote_ai/|evaluation/quote_ai/|release/)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.full == 'true'
        uses: databricks/setup-cli@main
      - if: steps.changed.outputs.full == 'true'
        run: databricks bundle deploy -t dev-shared
      - if: steps.changed.outputs.full == 'true'
        run: databricks bundle run quote_ai_eval -t dev-shared --params git_sha=${{ github.event.pull_request.head.sha }}

  # The QuoteAI app's React screens (AI-07) must build.
  quote-ai-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install && npm run build
        working-directory: src/quote_ai/app/frontend

  validate:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev-shared
