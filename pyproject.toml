[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quote_ai"
version = "0.1.0"
description = "QuoteAI for DBxLab Medical Supply: rules, services and AI for the DBX Architect Lab AI series"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]   # fastapi/httpx: the QuoteAI app back-end tests

# Only the QuoteAI package is built into the wheel; the identity and lakehouse code keep running as bundle files.
[tool.setuptools.packages.find]
where = ["src"]
include = ["quote_ai*"]

# AI-19: the Agent Skills (SKILL.md and their files) and AI-20's Lakebase schema ship with the package
[tool.setuptools.package-data]
quote_ai = ["agents/skills/*/*.md", "rules/sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
