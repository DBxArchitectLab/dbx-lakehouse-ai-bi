# QuoteAI ingestion: one entry per source, one engine (src/quote_ai/ingest). Checked by the schema in
# src/quote_ai/ingest/config.py on every pull request. After a change, regenerate the bundle resources:
#   python scripts/quote_ai/gen_ingest_resources.py
#
# Column names are normalized to snake_case on load (PrimaryDI -> primary_di), so keys are written in snake_case.
# Every bronze row also gets _source, _file_or_request, _load_id, _ingested_at and _release_date: not configurable.
#
# Checked against AccessGUDID on 2026-11-15: the delimited full release holds device.txt, identifiers.txt,
# deviceSizes.txt, productCodes.txt, gmdnTerms.txt (and contacts, sterilization, environment, submissions), with the
# columns the keys below name after snake_case; daily updates are one XML file per zip, one <device> element per
# record; the v3 history API accepts di and record_key and returns history keyed by version.
# Still to confirm in the first workspace run: AUTO CDC with null key parts (device_sizes_raw) and serverless egress.
version: 1

sources:
  # The monthly full release, pipe-delimited ("AccessGUDID_Delimited_Full_Release_YYYYMMDD.zip", about 400 MB).
  # Loaded once (or again to rebuild): job quote_ai_ingest_once, with the release date as a parameter.
  - name: gudid_full_release
    type: file
    description: AccessGUDID delimited full release, every device as published
    owner: data-platform
    schedule: once
    volume: quote_ai_gudid_bronze.quote_ai_releases
    landing: full
    download:
      url: "https://accessgudid.nlm.nih.gov/release_files/download/AccessGUDID_Delimited_Full_Release_{date:%Y%m%d}.zip"
      kind: full
    format: csv
    options: { sep: "|", header: "true", quote: "\u0000" }
    tables:
      - target: quote_ai_gudid_bronze.device_raw
        pattern: "device*.txt"
        keys: [primary_di]
        comment: One row per device identifier, the current published version
        expectations:
          primary_di_present: { rule: "primary_di IS NOT NULL", action: drop }
      - target: quote_ai_gudid_bronze.identifiers_raw
        pattern: "identifiers*.txt"
        keys: [primary_di, device_id]
        comment: Every identifier of a device, including package levels and their quantities
        expectations:
          device_id_present: { rule: "device_id IS NOT NULL", action: drop }
      - target: quote_ai_gudid_bronze.device_sizes_raw
        pattern: "deviceSizes*.txt"
        keys: [primary_di, size_type, size_unit, size_value, size_text]
        comment: Clinically relevant sizes (glove sizes S to XL); a size is a unit and value, or a text
      - target: quote_ai_gudid_bronze.product_codes_raw
        pattern: "productCodes*.txt"
        keys: [primary_di, product_code]
        comment: FDA product codes (LZA, LZC, ... for exam gloves)
      - target: quote_ai_gudid_bronze.gmdn_terms_raw
        pattern: "gmdnTerms*.txt"
        keys: [primary_di, gmdn_pt_name]
        comment: GMDN preferred terms

  # The daily update releases ("gudid_daily_update_YYYYMMDD.zip"): small, incremental, not every day.
  # Their format is not the delimited layout: kept in their own bronze table and merged with the full release in
  # silver (AI-03). Format and row tag to confirm against a real file.
  - name: gudid_daily_updates
    type: file
    description: AccessGUDID daily update releases, the device versions published that day
    owner: data-platform
    schedule: daily
    volume: quote_ai_gudid_bronze.quote_ai_releases
    landing: daily
    download:
      url: "https://accessgudid.nlm.nih.gov/release_files/download/gudid_daily_update_{date:%Y%m%d}.zip"
      kind: daily
      lookback_days: 7
    format: xml
    options: { rowTag: "device" }
    tables:
      - target: quote_ai_gudid_bronze.daily_device_raw
        pattern: "*.xml"
        keys: [public_device_record_key, public_version_number]
        comment: Device versions from the daily updates, as published
        expectations:
          record_key_present: { rule: "public_device_record_key IS NOT NULL", action: drop }

  # AccessGUDID API v3, device history, for the records that changed in today's update files only: the bulk files
  # fill the lakehouse; the API enriches what changed. Never one call per row of the full release.
  - name: gudid_api_device_history
    type: api
    description: AccessGUDID v3 device history for the records changed since the last successful run
    owner: data-platform
    schedule: daily
    base_url: "https://accessgudid.nlm.nih.gov/api/v3/"
    endpoint: devices/history.json
    ids_from:
      table: quote_ai_gudid_bronze.daily_device_raw
      column: public_device_record_key
      param: record_key
    api: { max_rps: 2, retries: 5, backoff_s: 2, max_requests_per_run: 2000, partitions: 2 }
    tables:
      - target: quote_ai_gudid_bronze.api_device_history
        keys: [public_device_record_key, public_version_number]
        comment: Every published version of the devices that changed, one row per version

  # DBxLab's synthetic commercial data: price book, stock, customers. Written by landing code on demand.
  - name: dbxlab_synthetic
    type: file
    description: DBxLab Medical Supply synthetic price book, inventory and customers (demo data)
    owner: sales-ops
    schedule: on_demand
    volume: quote_ai_sales_bronze.quote_ai_landing
    landing: dbxlab
    generator: dbxlab_synthetic
    format: csv
    options: { sep: ",", header: "true" }
    tables:
      - target: quote_ai_sales_bronze.price_book_raw
        pattern: "price_book*.csv"
        keys: [price_book_id, sku_id, tier, min_units]
      - target: quote_ai_sales_bronze.inventory_raw
        pattern: "inventory*.csv"
        keys: [snapshot_id, sku_id]
      - target: quote_ai_sales_bronze.customer_raw
        pattern: "customer*.csv"
        keys: [account_id]
