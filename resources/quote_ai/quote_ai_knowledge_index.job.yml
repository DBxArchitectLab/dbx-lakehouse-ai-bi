# The knowledge index (AI-16): supplier documents (as parsed by the quote_ai_documents pipeline), GUDID descriptions,
# the sales playbook, GMDN notes and the customers' price sheets, chunked by section (and fixed, AI-17's baseline),
# MERGEd into quote_ai_ai.knowledge_chunks, then the AI Search index knowledge_index synced (TRIGGERED).
# Run after quote_ai_mock_documents and quote_ai_search_index:
#   databricks bundle run quote_ai_knowledge_index -t dev
# Verify before recording: as in quote_ai_search_index.job.yml.
resources:
  jobs:
    quote_ai_knowledge_index:
      name: quote_ai_knowledge_index
      description: 'QuoteAI: chunk the knowledge sources (demo data) and sync the AI Search knowledge index'
      max_concurrent_runs: 1
      tags:
        app: quote_ai
        part: search
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"     # nightly, after the search index
        timezone_id: UTC
      tasks:
        - task_key: setup
          environment_key: default
          spark_python_task:
            python_file: ../../src/quote_ai/jobs/knowledge_job.py
            parameters: [setup, --catalog, "${var.catalog}", --schemas, &schemas "quote_ai_product=${resources.schemas.quote_ai_product.name},quote_ai_sales=${resources.schemas.quote_ai_sales.name},quote_ai_ai=${resources.schemas.quote_ai_ai.name},quote_ai_gudid_gold=${resources.schemas.quote_ai_gudid_gold.name}"]
        - task_key: accounts
          depends_on: [{ task_key: setup }]
          environment_key: default
          spark_python_task:
            python_file: ../../src/quote_ai/jobs/knowledge_job.py
            parameters: [accounts, --catalog, "${var.catalog}", --schemas, *schemas]
        - task_key: chunk
          depends_on: [{ task_key: setup }]
          environment_key: default
          spark_python_task:
            python_file: ../../src/quote_ai/jobs/knowledge_job.py
            parameters: [chunk, --catalog, "${var.catalog}", --schemas, *schemas]
        - task_key: sync_index
          depends_on: [{ task_key: chunk }]
          environment_key: search
          spark_python_task:
            python_file: ../../src/quote_ai/jobs/knowledge_job.py
            parameters: [index, --endpoint, quote_ai_search, --embedding-endpoint, "quote_ai_embed_${var.quote_ai_target}", --catalog, "${var.catalog}", --schemas, *schemas]
        - task_key: grants
          depends_on: [{ task_key: sync_index }, { task_key: accounts }]
          environment_key: default
          spark_python_task:
            python_file: ../../src/quote_ai/jobs/knowledge_job.py
            parameters: [grants, --app-sp, "${resources.apps.quote_ai_app.service_principal_client_id}", --catalog, "${var.catalog}", --schemas, *schemas]
      environments:
        - environment_key: default
          spec:
            environment_version: '2'
            dependencies:
              - pydantic>=2.7
              - pyyaml>=6
        - environment_key: search
          spec:
            environment_version: '2'
            dependencies:
              - pydantic>=2.7
              - pyyaml>=6
              - databricks-vectorsearch
